<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3157"/>
      <stop offset="1" stop-color="#0f1120"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f4f6ff"/>
      <stop offset="0.55" stop-color="#b9c8ff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="500" cy="430" r="330" fill="url(#glow)"/>
  <!-- crescent moon -->
  <path d="M 477.02 171.05 A 250 250 0 1 0 729.76 518.57 A 215 215 0 0 1 477.02 171.05 Z" fill="url(#moon)"/>
  <!-- stars -->
  <circle cx="700" cy="250" r="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="760" cy="350" r="7" fill="#c7d2fe" opacity="0.8"/>
  <circle cx="300" cy="230" r="6" fill="#c7d2fe" opacity="0.7"/>
  <!-- </> -->
  <g fill="none" stroke="url(#code)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="390,700 310,760 390,820"/>
    <polyline points="634,700 714,760 634,820"/>
    <line x1="550" y1="680" x2="474" y2="840"/>
  </g>
</svg>
