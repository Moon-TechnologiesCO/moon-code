<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Code</title>
<style>
  :root { --bg:#1a1b26; --fg:#c0caf5; --accent:#7aa2f7; --panel:#24283b; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; line-height:1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { color: var(--accent); font-size: 2.6rem; margin-bottom: .2rem; }
  pre { background: var(--panel); padding: 1rem; border-radius: 8px; overflow-x: auto; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🌙 Moon Code</h1>
  <p>Editor de código para la terminal: explorador de archivos, pestañas, temas Moon y chat de IA local con Ollama.</p>
  <h2>Instalar</h2>
  <pre><code>pip install "git+https://github.com/Moon-TechnologiesCO/moon-code.git"
moon ./mi-proyecto</code></pre>
  <h2>Actualizar</h2>
  <pre><code>moon update</code></pre>
  <p><a href="https://github.com/Moon-TechnologiesCO/moon-code">Código fuente en GitHub</a> · Licencia MIT</p>
</main>
</body>
</html>
